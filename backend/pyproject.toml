[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Kanban Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "fpdf2>=2.8.9",
    "litellm>=1.105.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
